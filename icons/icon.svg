        stroke="#ffffff" stroke-opacity="0.22" stroke-width="8" stroke-linejoin="round"/>

  <!-- Areia superior e inferior (monte arredondado) -->
  <path d="M196 138 H316 L256 248 Z" fill="url(#sand)"/>
  <path d="M256 268 C 278 300 300 342 316 374 H196 C 212 342 234 300 256 268 Z" fill="url(#sand)"/>

  <!-- Fluxo central -->
  <rect x="252" y="248" width="8" height="30" rx="4" fill="#ddc296"/>

  <!-- Armação -->
  <rect x="148" y="86" width="216" height="34" rx="12" fill="url(#frame)"/>
  <rect x="148" y="392" width="216" height="34" rx="12" fill="url(#frame)"/>
