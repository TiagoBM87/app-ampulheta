<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Ampulheta">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e2b478" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#e2b478" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2e3c2"/>
      <stop offset="55%" stop-color="#ddc296"/>
      <stop offset="100%" stop-color="#c09a68"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c99a6a"/>
      <stop offset="52%" stop-color="#9a6a40"/>
      <stop offset="100%" stop-color="#5e3b22"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#0f1115"/>
  <circle cx="256" cy="256" r="210" fill="url(#glow)"/>

  <!-- Corpo de vidro -->
  <path d="M172 122 H340 L256 256 L340 390 H172 L256 256 Z"
